<title>Guest Guide Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a Home of flat colour tiles (one per onboarding module, any order), each opening its own page.
   Same craft as the guides: flat colours, one geometric shape per tile, round arrow buttons, big type. */
:root{
  --paper:#EEECE6;--surface:#FFFFFF;--sunk:#F6F5F1;--ink:#151515;--muted:#55534E;--faint:#7E7B74;--line:#DAD6CC;
  --pine:#1E5E50;--sun:#F2B33D;--tomato:#D8483A;--sky:#3567AD;--plum:#6A3D73;--clay:#C9783E;
  --on-dark:#FFFFFF;--ok:#1E7A4A;--warn:#B7791F;--danger:#B23E28;--focus:#F2B33D;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;--r-s:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121312;--surface:#1C1D1C;--sunk:#171817;--ink:#EDEBE6;--muted:#A9A69F;--faint:#85827B;--line:#2E2F2D;
  --ok:#6FD39C;--warn:#F2B33D;--danger:#F08A73;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121312;--surface:#1C1D1C;--sunk:#171817;--ink:#EDEBE6;--muted:#A9A69F;--faint:#85827B;--line:#2E2F2D;
  --ok:#6FD39C;--warn:#F2B33D;--danger:#F08A73;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:14px 90px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.02em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Brand bar */
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.door{width:30px;height:38px;border-radius:15px 15px 3px 3px;background:var(--pine);position:relative;flex:none}
.door::after{content:"";position:absolute;right:7px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--sun)}
.brand b{font:800 23px/1 var(--display);letter-spacing:-.03em}
.save{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sdot.ok{background:var(--ok)}.sdot.busy{background:var(--warn)}.sdot.err{background:var(--danger)}
.owner{border:0;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 0 0 1.5px var(--line)}

/* Hero: the guide being built + progress */
.hero{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:22px 20px 20px;position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;z-index:-1;width:190px;height:190px;border-radius:50%;background:var(--sun);right:-60px;top:-80px}
.hero::after{content:"";position:absolute;z-index:-1;width:90px;height:45px;border-radius:90px 90px 0 0;background:var(--tomato);right:40px;bottom:0}
.hero small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:800;max-width:15ch}
.hero p{margin:0;opacity:.85;max-width:46ch;font-size:15px}
.meter{display:flex;gap:4px;max-width:520px}
.meter i{flex:1;height:10px;border-radius:3px;background:rgba(255,255,255,.18)}
.meter i.c{background:var(--sun);opacity:.55}
.meter i.d{background:var(--sun);opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:600;opacity:.9}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--sun)}
.legend i.c{opacity:.55}.legend i.n{background:rgba(255,255,255,.18)}
.go-next{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--sun);color:#1b1407;border:0;border-radius:999px;padding:11px 12px 11px 18px;font-weight:700;cursor:pointer;text-decoration:none;max-width:100%}
.go-next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go-next .ar{width:30px;height:30px;border-radius:50%;background:#1b1407;color:var(--sun);display:grid;place-items:center;flex:none}
.ar svg,.go svg{width:17px;height:17px}

/* Groups and tiles */
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.gh h2{font-size:24px;font-weight:700}
.gh span{font-size:14px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;min-height:150px;padding:16px;border-radius:var(--r);background:var(--tc);color:var(--ti);text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ic{width:32px;height:32px;margin-bottom:auto}
.tile .ic svg{width:32px;height:32px}
.tile b{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.08;letter-spacing:-.01em;margin-top:16px;position:relative;z-index:1;padding-right:6px}
.tile small{font-size:14px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1}
.tile::before,.tile::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.tile[data-shape="circle"]::before{width:130px;height:130px;border-radius:50%;background:var(--sh);right:-46px;top:-46px}
.tile[data-shape="half"]::before{width:104px;height:52px;border-radius:0 0 104px 104px;background:var(--sh);right:-6px;top:0}
.tile[data-shape="tri"]::before{width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-top:80px solid var(--sh);right:-16px;top:0}
.tile[data-shape="square"]::before{width:62px;height:62px;background:var(--sh);right:-12px;top:-14px;transform:rotate(14deg)}
.tile[data-shape="bar"]::before{width:96px;height:96px;border-radius:50%;border:16px solid var(--sh);right:-34px;top:-34px}
.tile[data-shape="quarter"]::before{width:110px;height:110px;border-radius:0 0 0 110px;background:var(--sh);right:0;top:0}
.pill{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink);white-space:nowrap}
.pill.new{background:rgba(255,255,255,.22);color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.pill.chk{background:var(--surface);color:var(--warn)}
.pill.done{background:var(--surface);color:var(--ok)}
.pill svg{width:13px;height:13px}
.tile.send{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:20px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tile.send b{margin:0;font-size:24px}
.tile.send small{margin:0;color:var(--muted);opacity:1}
.tile.send .go{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.tile.send .tx{display:flex;flex-direction:column;min-width:0}
.tile.send.locked .go{background:var(--line);color:var(--muted)}

/* Module page */
.mhead{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;isolation:isolate;background:var(--tc);color:var(--ti);border-radius:var(--r);padding:20px 20px 22px}
.mhead::before{content:"";position:absolute;z-index:-1;width:170px;height:170px;border-radius:50%;background:var(--sh);right:-60px;top:-70px}
.mhead .row1{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.back svg{width:16px;height:16px}
.mhead .pill{position:static;margin-left:auto}
.mhead h1{font-size:clamp(30px,6vw,42px);font-weight:800;max-width:18ch}
.mhead p{margin:0;max-width:56ch;font-size:16px;opacity:.92}
.card{background:var(--surface);border-radius:var(--r);padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:22px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lab{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sun);color:#1b1407}
.req.ok{background:none;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt{color:var(--faint);font-weight:500;font-size:13px}
.hint{color:var(--muted);font-size:13.5px;margin:0}
input[type=text],input[type=url],input[type=tel],input[type=email],input[type=number],input[type=time],select,textarea{width:100%;background:var(--sunk);border:1.5px solid var(--line);border-radius:var(--r-s);padding:11px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--sunk);font-weight:600;font-size:14.5px}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.note{display:flex;gap:10px;background:var(--sunk);border-radius:var(--r-s);padding:12px 14px;font-size:14px;box-shadow:inset 3px 0 0 var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1b1407}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:7px 12px;font-size:14px;border-width:1.5px}
.btn svg{width:17px;height:17px}
.foot{display:flex;flex-direction:column;gap:12px;border-top:1.5px solid var(--line);padding-top:18px}
.foot .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.todo{margin:0;font-size:14px;color:var(--muted)}
.todo b{color:var(--ink)}
/* Uploads */
.drop{border:2px dashed var(--line);border-radius:var(--r-s);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.drop.over{border-color:var(--ink)}
.drop .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.drop .row p{margin:0;color:var(--muted);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.thumb{position:relative;border-radius:var(--r-s);overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thumb .doc{aspect-ratio:4/3;display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:13px;padding:8px;text-align:center;word-break:break-word}
.thumb .fl{position:absolute;left:6px;top:6px;background:rgba(21,21,21,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.thumb select{border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 8px;font-size:13px;background:var(--surface)}
.thumb .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.thumb.pending{opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.err{color:var(--danger);font-size:14px;margin:0}
/* Mood cards */
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.mood{position:relative;cursor:pointer}
.mood input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.mood .box{border:2px solid var(--line);border-radius:16px;padding:9px;display:flex;flex-direction:column;gap:7px;background:var(--surface);height:100%}
.mood input:checked~.box{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.mood input:focus-visible~.box{outline:3px solid var(--focus);outline-offset:2px}
/* Layout choice: a skeleton of each guide layout (cover, house name, then the Home sections). */
.mock{height:128px;border-radius:9px;overflow:hidden;display:grid;gap:4px;padding:7px}
.mock i{display:block;min-height:0}
.mood b{font-size:15px}.mood small{color:var(--muted);font-size:12.5px;line-height:1.35}
.m-bold,.m-soft,.m-min,.m-med,.m-rural{grid-template-columns:1fr 1fr;grid-template-rows:34px 6px 1fr 1fr}
.m-bold i:nth-child(1),.m-soft i:nth-child(1),.m-min i:nth-child(1),.m-med i:nth-child(1),.m-rural i:nth-child(1){grid-column:1/-1}
.m-bold i:nth-child(2),.m-soft i:nth-child(2),.m-min i:nth-child(2),.m-med i:nth-child(2),.m-rural i:nth-child(2){grid-column:1/-1;width:55%;border-radius:3px}
.m-bold{background:#F3EEE3}
.m-bold i{border-radius:6px}
.m-bold i:nth-child(1){background:linear-gradient(135deg,#7f93a8,#c9b48a)}.m-bold i:nth-child(2){background:#121212}
.m-bold i:nth-child(3){background:#1D4FA0}.m-bold i:nth-child(4){background:#F5C400}.m-bold i:nth-child(5){background:#D52B1E}.m-bold i:nth-child(6){background:#121212}
.m-soft{background:#F6EEF0}
.m-soft i{border-radius:13px}
.m-soft i:nth-child(1){background:linear-gradient(135deg,#d9c7cf,#f3dcc8)}.m-soft i:nth-child(2){background:#8a7a80}
.m-soft i:nth-child(3){background:#D3E3F6}.m-soft i:nth-child(4){background:#F7E6B0}.m-soft i:nth-child(5){background:#F6D0C8}.m-soft i:nth-child(6){background:#D3EBDC}
.m-med{background:#FBFAF6}.m-med i{border-radius:50% 50% 5px 5px / 16px 16px 5px 5px;background:#fff;box-shadow:inset 0 0 0 2px #1F4F96}
.m-med i:nth-child(1){border-radius:50% 50% 4px 4px / 22px 22px 4px 4px;box-shadow:none;background:linear-gradient(135deg,#9fc2e0,#f2e6c9)}.m-med i:nth-child(2){border-radius:3px;box-shadow:none;background:#1F4F96}
.m-med i:nth-child(4),.m-med i:nth-child(5){background:#1F4F96;box-shadow:none}
.m-rural{background:#F2ECDF}.m-rural i{border-radius:6px}
.m-rural i:nth-child(1){background:linear-gradient(135deg,#7d8f5a,#d9c08a)}.m-rural i:nth-child(2){background:#2A2318}
.m-rural i:nth-child(3){background:#5A7034}.m-rural i:nth-child(4){background:#E8D7A5}.m-rural i:nth-child(5){background:#A3482B}.m-rural i:nth-child(6){background:#2F5236}
.m-min{background:#fff;gap:0}
.m-min i{border:1px solid #e2e2e2}
.m-min i:nth-child(1){background:#ededed;border:0;margin-bottom:4px}.m-min i:nth-child(2){background:#111;border:0;margin-bottom:4px}
.m-auto{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 8px,var(--surface) 8px,var(--surface) 16px);place-items:center;font:700 26px var(--display);color:var(--faint)}
/* Section picker */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mod{position:relative}
.mod input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.mod .box{display:grid;grid-template-columns:24px 1fr;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--sunk);height:100%}
.mod .tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent}
.mod input:checked~.box{border-color:var(--ink);background:var(--surface)}
.mod input:checked~.box .tick{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mod input:focus-visible~.box{outline:3px solid var(--focus);outline-offset:2px}
.mod b{font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mod small{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sun);color:#1b1407}
.tag.q{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
/* Review summary */
.sum{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-s);overflow:hidden}
.sum a{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--sunk);text-decoration:none}
.sum .sw{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.sum b{font-size:15px}
.sum p{margin:2px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
/* Status view */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps li{border-top:5px solid var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
.steps li.done{border-color:var(--pine);color:var(--ink)}
.steps li.now{border-color:var(--sun);color:var(--ink);font-weight:700}
.steps li span{display:block;font-weight:400;color:var(--muted)}
.msg{border-radius:var(--r-s);padding:12px 14px;background:var(--sunk);box-shadow:inset 3px 0 0 var(--pine);white-space:pre-line}
.stars{display:flex;gap:6px}
.stars label{position:relative}
.stars input{position:absolute;opacity:0;inset:0;cursor:pointer}
.stars span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-weight:700;background:var(--sunk)}
.stars input:checked+span{background:var(--sun);border-color:var(--sun);color:#1b1407}
.rounds{display:flex;flex-direction:column;gap:8px}
.rounds div{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:var(--r-s);padding:10px 12px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home" aria-label="Guest Guide Maker, all steps"><span class="door" aria-hidden="true"></span><b>Guest Guide Maker</b></a>
    <span class="save" id="saveState"><span class="sdot"></span><span>Connecting…</span></span>
    <span id="ownerSlot"></span>
  </header>
  <main id="main" class="wrap" style="gap:18px"><div class="loading">Loading your onboarding…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2600); };

const v = k => A[k] ?? '';
const visible = () => MODULES.filter(m => (!m.sec || secOn(m.sec)));
const filled = k => { if (k.startsWith('upload:')) return uploads.some(u => u.kind === k.slice(7)); const x = A[k]; return Array.isArray(x) ? x.length > 0 : !!String(x ?? '').trim(); };
const missingOf = m => m.need.filter(k => !filled(k));
const NAME = k => k.startsWith('upload:') ? (UP[k.slice(7)] || {}).label : (Q[k] || {}).label;
function statusOf(m){
  const miss = missingOf(m).length, seen = (A._seen || []).includes(m.id), done = !!(A._done || {})[m.id];
  if (done && !miss) return { k:'done', label:'Done', miss };
  if (seen || done) return { k:'chk', label: miss ? `${miss} to do` : 'Checked', miss };
  return { k:'new', label:'Start', miss };
}
const sendMissing = () => [...visible().filter(m => statusOf(m).k !== 'done').map(m => m.title), ...(v('email') ? [] : ['Your email']), ...(A.consent ? [] : ['The consent box'])];

/* ---------- Saving ---------- */
let saveTimer = null, saving = false, dirty = false;
function setSave(state, text){ $('#saveState').innerHTML = `<span class="sdot ${state}"></span><span>${esc(text)}</span>`; }
function queueSave(){ dirty = true; setSave('busy','Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush(){
  if (!db || !uid) { setSave('err','Not saved: open this in Claude, signed in'); return; }
  if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); return; }
  if (!dirty) return;
  saving = true; dirty = false;
  try { await db.doc('hosts/' + uid).update({ answers: A, updatedAt: new Date().toISOString(), progress: visible().filter(m => statusOf(m).k === 'done').length + '/' + visible().length }); setSave('ok','Saved'); }
  catch (e) { dirty = true; setSave('err', e && e.code === 'quota_exceeded' ? 'Storage full. Remove a photo.' : 'Could not save. Retrying…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 4000); }
  finally { saving = false; }
}

/* ---------- Images ---------- */
function loadImg(file){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
async function shrink(file, max, limit){
  const img = await loadImg(file);
  let s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    const d = c.toDataURL('image/jpeg', [0.82,0.74,0.66,0.6,0.55,0.5][k]);
    if (d.length < limit) return { dataUrl: d, w: c.width, h: c.height };
    s *= 0.82;
  }
  throw new Error('too_big');
}
async function addFiles(kind, files, max){
  const have = uploads.filter(u => u.kind === kind && !u.round).length + [...pending.values()].filter(p => p.kind === kind).length;
  const list = [...files].slice(0, Math.max(0, max - have));
  if (files.length > list.length) toast(`Up to ${max} here`);
  for (const f of list) {
    const tmp = 'p' + Math.random().toString(36).slice(2), isImg = /^image\//.test(f.type);
    pending.set(tmp, { kind, name: f.name, preview: isImg ? URL.createObjectURL(f) : null }); render();
    try {
      const rec = { kind, name: f.name, type: f.type || 'application/octet-stream', room: '', createdAt: new Date().toISOString() };
      if (assets) {
        let blob = f;
        if (isImg && f.size > 6e6) { const s = await shrink(f, 2400, 8e6); blob = await (await fetch(s.dataUrl)).blob(); }
        const r = await assets.upload(blob); rec.assetId = r.id; rec.url = r.url;
      } else if (isImg) { const s = await shrink(f, 1400, 230000); rec.dataUrl = s.dataUrl; rec.w = s.w; rec.h = s.h; }
      else throw new Error('pdf_needs_assets');
      await db.collection('hosts/' + uid + '/uploads').add(rec);
    } catch (e) {
      toast(e && e.message === 'pdf_needs_assets' ? `${f.name}: send a photo or screenshot instead of a PDF` : e && e.code === 'too_large' ? `${f.name} is too large` : `${f.name} could not be uploaded`);
    } finally { pending.delete(tmp); render(); }
  }
}

  else if (t.dataset.radio) { set(t.dataset.radio, t.value); softRefresh(); }
  else if (t.dataset.k && t.tagName === 'SELECT') { set(t.dataset.k, t.value); softRefresh(); }
  else if (t.dataset.sec) { A.modules = { ...Object.fromEntries(SECTIONS.map(s => [s.id, secOn(s.id)])), [t.dataset.sec]: t.checked }; queueSave(); render(); }
  else if (t.dataset.check) { set(t.dataset.check, t.checked); refreshSend(); }
  else if (t.dataset.file) { addFiles(t.dataset.file, t.files, +t.closest('[data-drop]').dataset.max); t.value = ''; }
  else if (t.dataset.room) db.doc('hosts/' + uid + '/uploads/' + t.dataset.room).update({ room: t.value }).catch(() => toast('Could not save the room'));
  else if (t.dataset.ostatus) ownerSet(t.dataset.ostatus, { status: t.value });
});
function refreshSend(){ if (route() === 'send') { const keep = document.activeElement && document.activeElement.id; const miss = sendMissing(); const b = $('#send'); if (b) b.disabled = !!miss.length; const tt = document.querySelector('.foot .todo'); if (tt) tt.innerHTML = miss.length ? `Before sending: <b>${miss.map(esc).join(', ')}</b>` : ''; } }
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.done) { A._done = { ...(A._done || {}), [b.dataset.done]: true }; queueSave(); render(); toast('Done'); }
  else if (b.dataset.undone) { const d = { ...(A._done || {}) }; delete d[b.dataset.undone]; A._done = d; queueSave(); render(); }
  else if (b.dataset.del) { const u = uploads.find(x => x.id === b.dataset.del); try { await db.doc('hosts/' + uid + '/uploads/' + b.dataset.del).delete(); if (u && u.assetId && assets) assets.delete(u.assetId).catch(() => {}); } catch (err) { toast('Could not remove it'); } }
  else if (b.id === 'autofill') autofill(b);
  else if (b.id === 'send') send(b);
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fb') return;
  e.preventDefault();
  const f = new FormData(e.target), shots = uploads.filter(u => u.kind === 'feedback' && !u.round).map(u => u.id);
  const rec = { round: feedback.length + 1, rating: +f.get('rating') || null, right: f.get('right') || '', wrong: f.get('wrong') || '', areas: f.getAll('areas'), next: f.get('next'), screenshots: shots, createdAt: new Date().toISOString() };
  const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
  try {
    await db.doc(`hosts/${uid}/feedback/round-${rec.round}`).set(rec);
    for (const id of shots) await db.doc('hosts/' + uid + '/uploads/' + id).update({ round: rec.round });
    await db.doc('hosts/' + uid).update({ status: rec.next === 'publish' ? 'review' : 'changes', lastFeedbackAt: rec.createdAt, wantsPublish: rec.next === 'publish' });
    toast('Feedback sent. Thank you!');
  } catch (err) { btn.disabled = false; toast('Could not send. Try again.'); }
});
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault();
  d.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files.length && db && uid) addFiles(d.dataset.drop, e.dataTransfer.files, +d.dataset.max);
}));
async function autofill(b){
  b.disabled = true; const st = $('#afState'); if (st) st.textContent = 'Reading your listing…';
  try {
    const r = await sample.json('You extract facts from a holiday-rental listing that its host pasted. Return ONLY a JSON object with these keys, null when the text does not say: ' +
      '{"placeName": string, "propertyType": one of ["House","Villa","Apartment","Cottage","Farmhouse","Room","Other"], "town": string, "region": string (region and country), "sleeps": number, ' +
      '"checkIn": "HH:MM", "checkOut": "HH:MM", "amenities": array chosen only from ' + JSON.stringify(AMEN) + ', "houseRules": string (one rule per line), "tagline": string (one warm welcome line under 60 characters, in English)}. ' +
      'Never invent a street address. Listing link: ' + (v('listingUrl') || 'none') + '\n\nListing text:\n' + v('listingText').slice(0, 8000), { modelTier: 'quick' });
    const got = [];
    for (const k of ['placeName','propertyType','town','region','checkIn','checkOut','houseRules','tagline']) if (r && r[k] && !v(k)) { A[k] = String(r[k]); got.push(k); }
    if (r && r.sleeps && !v('sleeps')) { A.sleeps = String(r.sleeps); got.push('sleeps'); }
    if (r && Array.isArray(r.amenities) && r.amenities.length) { A.amenities = [...new Set([...(A.amenities || []), ...r.amenities.filter(x => AMEN.includes(x))])]; got.push('amenities'); }
    queueSave(); render();
    const s2 = $('#afState'); if (s2) s2.textContent = got.length ? `Filled ${got.length} answers, here and in other steps. Check them.` : 'Nothing new found in that text.';
  } catch (err) {
    const s2 = $('#afState'); if (s2) s2.textContent = err && err.code === 'not_granted' ? 'Not allowed here. Fill it in by hand.' : 'Could not read it this time. Fill it in by hand.';
    const bb = $('#autofill'); if (bb) bb.disabled = false;
  }
}
async function send(b){
  b.disabled = true;
  try { clearTimeout(saveTimer); dirty = true; await flush(); await db.doc('hosts/' + uid).update({ status: 'submitted', submittedAt: new Date().toISOString(), answers: A }); location.hash = '#status'; toast('Sent! We start building your guide.'); }
  catch (err) { b.disabled = false; toast('Could not send. Try again.'); }
}
const ownerTimers = {};
function ownerSet(id, patch){ const key = id + Object.keys(patch)[0]; clearTimeout(ownerTimers[key]); ownerTimers[key] = setTimeout(() => db.doc('hosts/' + id).update(patch).then(() => toast('Saved')).catch(() => toast('Could not save')), 600); }

/* ---------- Boot ---------- */
render();
(async () => {
  if (!window.claude || !window.claude.use) { setSave('err','Open this page in Claude to save'); return; }
  [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) { setSave('err','Sign in to save your answers'); render(); return; }
  uid = await user.id();
  if (!uid) { setSave('err','Sign in to save your answers'); render(); return; }
  isOwner = await user.isOwner();
  claude.use('assets').then(a => { assets = a; render(); });
  claude.use('sample').then(s => { sample = s; if (route() === 'listing') render(); });
  const ref = db.doc('hosts/' + uid);
  try { const snap = await ref.get(); if (!snap.exists) await ref.set({ answers: {}, status: 'draft', createdAt: new Date().toISOString() }); }
  catch (e) { setSave('err', 'Saving is not allowed for this link. Ask for Contributor access.'); }
  let first = true;
  ref.onSnapshot(s => {
    doc = s.data() || {};
    if (first) { A = doc.answers || {}; first = false; setSave('ok','Saved'); render(); return; }
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if (!typing) render();
  });
  db.collection('hosts/' + uid + '/uploads').onSnapshot(s => { uploads = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')); render(); });
  db.collection('hosts/' + uid + '/feedback').onSnapshot(s => { feedback = s.docs.map(d => d.data()).sort((a, b) => a.round - b.round); if (route() === 'status' || route() === 'home') render(); });
  if (isOwner) db.collection('hosts').onSnapshot(s => { hostsAll = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updatedAt || b.createdAt || '').localeCompare(a.updatedAt || a.createdAt || '')); if (route() === 'owner') render(); });
})();
})();
</script>
