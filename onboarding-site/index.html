when to go.":{"ca":"Comença a escriure el nom i tria’l de la llista: hi afegim el mapa i l’horari. També serveix una web o un enllaç de Google Maps. El teu comentari surt a la guia: què demanar, quan anar-hi.","es":"Empieza a escribir el nombre y elígelo de la lista: añadimos el mapa y el horario. También sirve una web o un enlace de Google Maps. Tu comentario aparece en la guía: qué pedir, cuándo ir.","fr":"Commencez à taper le nom et choisissez-le dans la liste : nous ajoutons la carte et les horaires. Un site web ou un lien Google Maps fonctionne aussi. Votre commentaire apparaît dans le guide : quoi commander, quand y aller."},"Start typing the name and pick it from the list. A website or a Google Maps link works too. Then add your comment: what it is like, when to go.":{"ca":"Comença a escriure el nom i tria’l de la llista. També serveix una web o un enllaç de Google Maps. Després afegeix-hi el teu comentari: com és, quan anar-hi.","es":"Empieza a escribir el nombre y elígelo de la lista. También sirve una web o un enlace de Google Maps. Luego añade tu comentario: cómo es, cuándo ir.","fr":"Commencez à taper le nom et choisissez-le dans la liste. Un site web ou un lien Google Maps fonctionne aussi. Ajoutez ensuite votre commentaire : à quoi ça ressemble, quand y aller."},"Starting your guide…":{"ca":"Començant la teva guia…","es":"Empezando tu guía…","fr":"Démarrage de votre guide…"},"Stations and stops":{"ca":"Estacions i parades","es":"Estaciones y paradas","fr":"Gares et arrêts"},"Still needed:":{"ca":"Encara falta:","es":"Aún falta:","fr":"Il manque encore :"},"Still needed for Done:":{"ca":"Encara falta per a Fet:","es":"Aún falta para Hecho:","fr":"Il manque encore pour Terminé :"},"Still worth a look":{"ca":"També val la pena","es":"También merece la pena","fr":"À voir aussi"},"Street, covered and flea markets, with what is on today.":{"ca":"Mercats al carrer, municipals i encants, amb el que hi ha avui.","es":"Mercadillos, mercados municipales y rastros, con lo que hay hoy.","fr":"Marchés en plein air, couverts et puces, avec ce qui a lieu aujourd’hui."},"Suggestion {n} of {m}":{"ca":"Suggeriment {n} de {m}","es":"Sugerencia {n} de {m}","fr":"Suggestion {n} sur {m}"},"Switch off what you do not need: its step here and its tile in the guide go too.":{"ca":"Desactiva el que no necessitis: també se’n van el seu pas d’aquí i el seu botó a la guia.","es":"Desactiva lo que no necesites: también se van su paso aquí y su botón en la guía.","fr":"Désactivez ce dont vous n’avez pas besoin : son étape ici et sa vignette dans le guide disparaissent aussi."},"Takes the guide offline: guests can no longer open it. Nothing is deleted, and you can publish it again any time.":{"ca":"Treu la guia de línia: els hostes ja no la poden obrir. No s’esborra res i la pots tornar a publicar quan vulguis.","es":"Retira la guía: los huéspedes ya no pueden abrirla. No se borra nada y puedes volver a publicarla cuando quieras.","fr":"Met le guide hors ligne : les voyageurs ne peuvent plus l’ouvrir. Rien n’est supprimé, et vous pouvez le republier à tout moment."},"Tap a photo to choose its room. Guests still see it with the photos of the house.":{"ca":"Toca una foto per triar-ne l’estança. Els hostes la continuen veient amb les fotos de la casa.","es":"Toca una foto para elegir su estancia. Los huéspedes la siguen viendo con las fotos de la casa.","fr":"Touchez une photo pour choisir sa pièce. Les voyageurs la voient toujours avec les photos de la maison."},"Tap to connect":{"ca":"Toca per connectar-te","es":"Toca para conectarte","fr":"Touchez pour vous connecter"},"Taxi in {n} min, 24/7":{"ca":"Taxi en {n} min, 24/7","es":"Taxi en {n} min, 24/7","fr":"Taxi en {n} min, 24 h/24"},"Taxi in 30 min, 3 stations":{"ca":"Taxi en 30 min, 3 estacions","es":"Taxi en 30 min, 3 estaciones","fr":"Taxi en 30 min, 3 gares"},"Taxi you trust":{"ca":"Taxi de confiança","es":"Taxi de confianza","fr":"Taxi de confiance"},"Taxis":{"ca":"Taxis","es":"Taxis","fr":"Taxis"},"Taxis, train stations and bus stops go in":{"ca":"Els taxis, les estacions de tren i les parades d’autobús van a","es":"Los taxis, las estaciones de tren y las paradas de autobús van en","fr":"Les taxis, gares et arrêts de bus vont dans"},"Taxis, train stations and bus stops, on their own page in the guide. Show it as a tile on the home page too if you like.":{"ca":"Taxis, estacions de tren i parades d’autobús, a la seva pàgina de la guia. Si vols, mostra-ho també com a botó a la pàgina d’inici.","es":"Taxis, estaciones de tren y paradas de autobús, en su propia página de la guía. Si quieres, muéstralo también como botón en la página de inicio.","fr":"Taxis, gares et arrêts de bus, sur leur propre page du guide. Affichez-le aussi en vignette sur la page d’accueil si vous voulez."},"Taxis, train stations and bus stops.":{"ca":"Taxis, estacions de tren i parades d’autobús.","es":"Taxis, estaciones de tren y paradas de autobús.","fr":"Taxis, gares et arrêts de bus."},"Tell us how rubbish works at the house and we write it here.":{"ca":"Explica’ns com funcionen les escombraries a la casa i ho escriurem aquí.","es":"Cuéntanos cómo funciona la basura en la casa y lo escribimos aquí.","fr":"Dites-nous comment fonctionnent les déchets à la maison et nous l’écrirons ici."},"Tells guests to check the hours or the dates before they go.":{"ca":"Avisa els hostes que comprovin l’horari o les dates abans d’anar-hi.","es":"Avisa a los huéspedes de que comprueben el horario o las fechas antes de ir.","fr":"Indique aux voyageurs de vérifier les horaires ou les dates avant d’y aller."},"Text under the link when you share it":{"ca":"Text sota l’enllaç quan el comparteixes","es":"Texto bajo el enlace cuando lo compartes","fr":"Texte sous le lien quand vous le partagez"},"The consent box":{"ca":"La casella de consentiment","es":"La casilla de consentimiento","fr":"La case de consentement"},"A free web address":{"ca":"Una adreça web lliure","es":"Una dirección web libre","fr":"Une adresse web libre"},"The town":{"ca":"El poble","es":"La población","fr":"La ville"},"Your listing link or text":{"ca":"L’enllaç o el text del teu anunci","es":"El enlace o el texto de tu anuncio","fr":"Le lien ou le texte de votre annonce"},"The first part is ours, the last part is yours. Short and easy to type works best.":{"ca":"La primera part és nostra, l’última és teva. Millor curta i fàcil d’escriure.","es":"La primera parte es nuestra, la última es tuya. Mejor corta y fácil de escribir.","fr":"La première partie est à nous, la dernière à vous. Court et facile à taper, c’est l’idéal."},"The gate, the turning, where to park, where the key is.":{"ca":"La porta, el trencall, on aparcar, on és la clau.","es":"La verja, el desvío, dónde aparcar, dónde está la llave.","fr":"Le portail, l’embranchement, où se garer, où est la clé."},"The guide opens in the guest’s phone language when it can.":{"ca":"La guia s’obre en l’idioma del mòbil de l’hoste quan pot.","es":"La guía se abre en el idioma del móvil del huésped cuando puede.","fr":"Le guide s’ouvre dans la langue du téléphone du voyageur quand c’est possible."},"The guide opens in the guest’s phone language when it can. The first one is the main language.":{"ca":"La guia s’obre en l’idioma del mòbil de l’hoste quan pot. El primer és l’idioma principal.","es":"La guía se abre en el idioma del móvil del huésped cuando puede. El primero es el idioma principal.","fr":"Le guide s’ouvre dans la langue du téléphone du voyageur quand c’est possible. La première est la langue principale."},"The layout’s own":{"ca":"Els del disseny","es":"Los del diseño","fr":"Celles de la mise en page"},"The name on the guide and on guests’ phones, the text under a shared link and the languages.":{"ca":"El nom de la guia i als mòbils dels hostes, el text sota un enllaç compartit i els idiomes.","es":"El nombre en la guía y en los móviles de los huéspedes, el texto bajo un enlace compartido y los idiomas.","fr":"Le nom du guide et sur le téléphone des voyageurs, le texte sous un lien partagé et les langues."},"The restaurants, cafés, bakeries and bars you send friends to. Guests see exactly this list, with your comments. We add none of our own.":{"ca":"Els restaurants, cafès, forns i bars on envies els amics. Els hostes veuen exactament aquesta llista, amb els teus comentaris. No n’afegim cap de nostre.","es":"Los restaurantes, cafés, panaderías y bares adonde mandas a tus amigos. Los huéspedes ven exactamente esta lista, con tus comentarios. No añadimos ninguno nuestro.","fr":"Les restaurants, cafés, boulangeries et bars où vous envoyez vos amis. Les voyageurs voient exactement cette liste, avec vos commentaires. Nous n’en ajoutons aucun."},"The taxi you trust, one tap away.":{"ca":"El taxi de confiança, a un toc.","es":"El taxi de confianza, a un toque.","fr":"Votre taxi de confiance, à portée de doigt."},"The times and the few rules that matter.":{"ca":"Els horaris i les quatre normes que importen.","es":"Los horarios y las pocas normas que importan.","fr":"Les horaires et les quelques règles qui comptent."},"The title of the guide, and the app name on guests’ phones.":{"ca":"El títol de la guia, i el nom de l’app als mòbils dels hostes.","es":"El título de la guía, y el nombre de la app en los móviles de los huéspedes.","fr":"Le titre du guide, et le nom de l’appli sur le téléphone des voyageurs."},"These settings apply at once: they are not part of the changes you publish.":{"ca":"Aquests ajustos s’apliquen de seguida: no formen part dels canvis que publiques.","es":"Estos ajustes se aplican al momento: no forman parte de los cambios que publicas.","fr":"Ces réglages s’appliquent tout de suite : ils ne font pas partie des modifications que vous publiez."},"Things to do":{"ca":"Què fer","es":"Qué hacer","fr":"À faire"},"Things to look for":{"ca":"Coses a buscar","es":"Cosas a buscar","fr":"Ce qu’il faut chercher"},"Topics to skip":{"ca":"Temes a evitar","es":"Temas a evitar","fr":"Thèmes à éviter"},"This cannot be undone.":{"ca":"No es pot desfer.","es":"No se puede deshacer.","fr":"C’est irréversible."},"This guide has no Wi-Fi card yet.":{"ca":"Aquesta guia encara no té targeta de wifi.","es":"Esta guía aún no tiene tarjeta de wifi.","fr":"Ce guide n’a pas encore de carte wifi."},"This steers the search: the places you swipe next, and the markets and events in your guide.":{"ca":"Això orienta la cerca: els llocs que veuràs a continuació, i els mercats i esdeveniments de la teva guia.","es":"Esto orienta la búsqueda: los sitios que verás a continuación, y los mercados y eventos de tu guía.","fr":"Cela oriente la recherche : les lieux que vous verrez ensuite, et les marchés et événements de votre guide."},"This step is done. You can still change anything.":{"ca":"Aquest pas està fet. Encara pots canviar el que vulguis.","es":"Este paso está hecho. Aún puedes cambiar lo que quieras.","fr":"Cette étape est terminée. Vous pouvez encore tout modifier."},"This takes a few minutes. You can close this page: your guide will be here when you come back.":{"ca":"Triga uns minuts. Pots tancar aquesta pàgina: la guia serà aquí quan tornis.","es":"Tarda unos minutos. Puedes cerrar esta página: tu guía estará aquí cuando vuelvas.","fr":"Cela prend quelques minutes. Vous pouvez fermer cette page : votre guide sera là à votre retour."},"Three ways to get around without a car.":{"ca":"Tres maneres de moure’s sense cotxe.","es":"Tres formas de moverse sin coche.","fr":"Trois façons de se déplacer sans voiture."},"Tick the day the bin is collected, not the day it goes out. Guests are told to take it out the night before. Leave a row empty if it is not collected.":{"ca":"Marca el dia que es recull el cubell, no el dia que es treu. Es diu als hostes que el treguin la nit abans. Deixa una fila buida si no es recull.","es":"Marca el día que se recoge el cubo, no el día que se saca. Se dice a los huéspedes que lo saquen la noche anterior. Deja una fila vacía si no se recoge.","fr":"Cochez le jour où la poubelle est vidée, pas celui où elle est sortie. On demande aux voyageurs de la sortir la veille au soir. Laissez une ligne vide si elle n’est pas collectée."},"Tile title":{"ca":"Títol del botó","es":"Título del botón","fr":"Titre de la vignette"},"Time":{"ca":"Hora","es":"Hora","fr":"Heure"},"Timetable link":{"ca":"Enllaç de l’horari","es":"Enlace del horario","fr":"Lien des horaires"},"Title":{"ca":"Títol","es":"Título","fr":"Titre"},"Title on its page":{"ca":"Títol a la seva pàgina","es":"Título en su página","fr":"Titre sur sa page"},"Titles":{"ca":"Títols","es":"Títulos","fr":"Titres"},"to":{"ca":"a","es":"a","fr":"à"},"To":{"ca":"A","es":"A","fr":"À"},"To confirm, type its web address:":{"ca":"Per confirmar-ho, escriu-ne l’adreça web:","es":"Para confirmarlo, escribe su dirección web:","fr":"Pour confirmer, tapez son adresse web :"},"To confirm, type your email:":{"ca":"Per confirmar-ho, escriu el teu correu:","es":"Para confirmarlo, escribe tu correo:","fr":"Pour confirmer, tapez votre e-mail :"},"To confirm, type:":{"ca":"Per confirmar-ho, escriu:","es":"Para confirmarlo, escribe:","fr":"Pour confirmer, tapez :"},"Today":{"ca":"Avui","es":"Hoy","fr":"Aujourd’hui"},"Tonight":{"ca":"Aquesta nit","es":"Esta noche","fr":"Ce soir"},"Town and services":{"ca":"Poble i serveis","es":"Pueblo y servicios","fr":"Ville et services"},"Town collection calendar":{"ca":"Calendari de recollida del poble","es":"Calendario de recogida del municipio","fr":"Calendrier de collecte de la commune"},"Train · {n} min by car":{"ca":"Tren · {n} min en cotxe","es":"Tren · {n} min en coche","fr":"Train · {n} min en voiture"},"Train · {n} min by car · {x}":{"ca":"Tren · {n} min en cotxe · {x}","es":"Tren · {n} min en coche · {x}","fr":"Train · {n} min en voiture · {x}"},"Bus · {n} min by car":{"ca":"Autobús · {n} min en cotxe","es":"Autobús · {n} min en coche","fr":"Bus · {n} min en voiture"},"Bus · {n} min by car · {x}":{"ca":"Autobús · {n} min en cotxe · {x}","es":"Autobús · {n} min en coche · {x}","fr":"Bus · {n} min en voiture · {x}"},"Train · no pin yet":{"ca":"Tren · encara sense punt al mapa","es":"Tren · aún sin chincheta","fr":"Train · pas encore de repère"},"Bus · no pin yet":{"ca":"Autobús · encara sense punt al mapa","es":"Autobús · aún sin chincheta","fr":"Bus · pas encore de repère"},"Translate missing texts":{"ca":"Tradueix els textos que falten","es":"Traducir los textos que faltan","fr":"Traduire les textes manquants"},"Type":{"ca":"Tipus","es":"Tipo","fr":"Type"},"Undo":{"ca":"Desfés","es":"Deshacer","fr":"Annuler"},"Unpublish":{"ca":"Despublica","es":"Despublicar","fr":"Dépublier"},"Upload a picture":{"ca":"Puja una imatge","es":"Subir una imagen","fr":"Importer une image"},"Urgent":{"ca":"Urgent","es":"Urgente","fr":"Urgent"},"Use one of your photos as it is, or have a new one drawn from it.":{"ca":"Fes servir una de les teves fotos tal com és, o fes-ne dibuixar una de nova.","es":"Usa una de tus fotos tal cual, o haz que dibujemos una nueva a partir de ella.","fr":"Utilisez une de vos photos telle quelle, ou faites-en dessiner une nouvelle."},"Use this photo as the cover":{"ca":"Fes servir aquesta foto com a portada","es":"Usar esta foto como portada","fr":"Utiliser cette photo en couverture"},"Usually takes a few minutes. Until a text is translated, guests see it in the main language. The translations arrive as changes you preview and publish.":{"ca":"Sol trigar uns minuts. Mentre un text no estigui traduït, els hostes el veuen en l’idioma principal. Les traduccions arriben com a canvis que revises i publiques.","es":"Suele tardar unos minutos. Mientras un texto no esté traducido, los huéspedes lo ven en el idioma principal. Las traducciones llegan como cambios que revisas y publicas.","fr":"Cela prend généralement quelques minutes. Tant qu’un texte n’est pas traduit, les voyageurs le voient dans la langue principale. Les traductions arrivent comme des modifications que vous prévisualisez et publiez."},"Waiting to start…":{"ca":"Esperant per començar…","es":"Esperando para empezar…","fr":"En attente de démarrage…"},"Want something unique? We redraw the photo you picked as an artwork.":{"ca":"Vols una cosa única? Redibuixem la foto que has triat com una obra d’art.","es":"¿Quieres algo único? Redibujamos la foto que has elegido como una obra de arte.","fr":"Envie de quelque chose d’unique ? Nous redessinons la photo choisie comme une œuvre d’art."},"We add the nearest hospital, pharmacy and on-call doctor, with hours.":{"ca":"Hi afegim l’hospital, la farmàcia i el metge de guàrdia més propers, amb horaris.","es":"Añadimos el hospital, la farmacia y el médico de guardia más cercanos, con horarios.","fr":"Nous ajoutons l’hôpital, la pharmacie et le médecin de garde les plus proches, avec leurs horaires."},"We are looking for more places near you":{"ca":"Busquem més llocs a prop teu","es":"Estamos buscando más sitios cerca de ti","fr":"Nous cherchons d’autres lieux près de chez vous"},"We build your guide from your answers. You can change anything afterwards.":{"ca":"Fem la teva guia amb les teves respostes. Després pots canviar el que vulguis.","es":"Creamos tu guía con tus respuestas. Después puedes cambiar lo que quieras.","fr":"Nous créons votre guide à partir de vos réponses. Vous pourrez tout modifier ensuite."},"We cannot search places near you right now. Add the ones you recommend below.":{"ca":"Ara mateix no podem buscar llocs a prop teu. Afegeix a sota els que recomanes.","es":"Ahora mismo no podemos buscar sitios cerca de ti. Añade abajo los que recomiendas.","fr":"Impossible de chercher des lieux près de chez vous pour l’instant. Ajoutez ci-dessous ceux que vous recommandez."},"We found {n} more places near you. Only the ones you keep go in your guide.":{"ca":"Hem trobat {n} llocs més a prop teu. Només aniran a la guia els que et quedis.","es":"Hemos encontrado {n} sitios más cerca de ti. Solo irán en tu guía los que te quedes.","fr":"Nous avons trouvé {n} autres lieux près de chez vous. Seuls ceux que vous gardez iront dans votre guide."},"We found {n} more place near you. Only the ones you keep go in your guide.":{"ca":"Hem trobat {n} lloc més a prop teu. Només aniran a la guia els que et quedis.","es":"Hemos encontrado {n} sitio más cerca de ti. Solo irán en tu guía los que te quedes.","fr":"Nous avons trouvé {n} autre lieu près de chez vous. Seuls ceux que vous gardez iront dans votre guide."},"We look for events in the next three months around the house: the area's own traditions, festivals and fairs, plus the topics below.":{"ca":"Busquem esdeveniments dels pròxims tres mesos al voltant de la casa: les tradicions, festes i fires de la zona, i els temes de sota.","es":"Buscamos eventos de los próximos tres meses alrededor de la casa: las tradiciones, fiestas y ferias de la zona, más los temas de abajo.","fr":"Nous cherchons les événements des trois prochains mois autour de la maison : les traditions, fêtes et foires du coin, plus les thèmes ci-dessous."},"We look up the lines through it and where they go. Nothing to type.":{"ca":"Busquem les línies que hi passen i on van. No cal escriure res.","es":"Buscamos las líneas que pasan y adónde van. No hay que escribir nada.","fr":"Nous cherchons les lignes qui y passent et leurs destinations. Rien à taper."},"We search the web around the house for markets that are not in your guide yet, check each one on Google and translate it. It takes a few minutes, then you keep or skip each one.":{"ca":"Busquem al web mercats a prop de la casa que encara no són a la guia, els comprovem a Google i els traduïm. Triga uns minuts; després esculls quins et quedes.","es":"Buscamos en la web mercados cerca de la casa que aún no están en tu guía, los comprobamos en Google y los traducimos. Tarda unos minutos; después eliges cuáles te quedas.","fr":"Nous cherchons sur le web les marchés autour de la maison qui ne sont pas encore dans votre guide, vérifions chacun sur Google et le traduisons. Cela prend quelques minutes, puis vous gardez ou écartez chacun."},"We search the web around the house for things to do that are not in your guide yet, check each one on Google and translate it. It takes a few minutes, then you keep or skip each one.":{"ca":"Busquem al web coses per fer a prop de la casa que encara no són a la guia, les comprovem a Google i les traduïm. Triga uns minuts; després esculls quines et quedes.","es":"Buscamos en la web cosas que hacer cerca de la casa que aún no están en tu guía, las comprobamos en Google y las traducimos. Tarda unos minutos; después eliges cuáles te quedas.","fr":"Nous cherchons sur le web des choses à faire autour de la maison qui ne sont pas encore dans votre guide, vérifions chacune sur Google et la traduisons. Cela prend quelques minutes, puis vous gardez ou écartez chacune."},"Web address of your guide":{"ca":"Adreça web de la teva guia","es":"Dirección web de tu guía","fr":"Adresse web de votre guide"},"Website":{"ca":"Web","es":"Web","fr":"Site web"},"Weekly markets, with what is on today.":{"ca":"Mercats setmanals, amb el que hi ha avui.","es":"Mercados semanales, con lo que hay hoy.","fr":"Marchés hebdomadaires, avec ce qui a lieu aujourd’hui."},"Weekly street markets, covered food markets, flea and antiques markets nearby. The guide shows which ones are on today from the days and hours here.":{"ca":"Mercats setmanals al carrer, mercats municipals, encants i antiguitats a prop. La guia mostra quins hi ha avui segons els dies i horaris d’aquí.","es":"Mercadillos semanales, mercados municipales, rastros y antigüedades cerca. La guía muestra cuáles hay hoy según los días y horarios de aquí.","fr":"Marchés hebdomadaires en plein air, marchés couverts, puces et antiquités à proximité. Le guide montre ceux du jour d’après les jours et horaires indiqués ici."},"Welcome line":{"ca":"Frase de benvinguda","es":"Frase de bienvenida","fr":"Phrase d’accueil"},"Welcome to":{"ca":"Benvinguts a","es":"Bienvenidos a","fr":"B  funciona i què no.","es":"Ábrela en tu móvil, úsala como un huésped y luego cuéntanos qué funciona y qué no.","fr":"Ouvrez-le sur votre téléphone, utilisez-le comme un voyageur, puis dites-nous ce qui marche et ce qui ne marche pas."},"Organic goes in the small brown bin under the sink. Bring cardboard flat…":{"ca":"L’orgànica va al cubell marró petit de sota la pica. El cartró, ben pla…","es":"Lo orgánico va al cubo marrón pequeño bajo el fregadero. El cartón, bien plano…","fr":"Les biodéchets vont dans la petite poubelle marron sous l’évier. Le carton bien plié…"},"Our research is finding more: they will land here in about 2 minutes.":{"ca":"La nostra recerca en troba més: arribaran aquí en uns 2 minuts.","es":"Nuestra búsqueda está encontrando más: llegarán aquí en unos 2 minutos.","fr":"Notre recherche en trouve d’autres : ils arriveront ici dans environ 2 minutes."},"Overall":{"ca":"En general","es":"En general","fr":"Dans l’ensemble"},"Paste my link":{"ca":"Enganxa el meu enllaç","es":"Pegar mi enlace","fr":"Coller mon lien"},"Paste the “About this space” text, house rules and amenities.":{"ca":"Enganxa el text «Sobre aquest espai», les normes de la casa i els serveis.","es":"Pega el texto «Sobre este espacio», las normas de la casa y los servicios.","fr":"Collez le texte « À propos de ce logement », le règlement intérieur et les équipements."},"Photos of the place":{"ca":"Fotos de l’allotjament","es":"Fotos del alojamiento","fr":"Photos du logement"},"Place":{"ca":"Lloc","es":"Sitio","fr":"Lieu"},"Places nearby":{"ca":"Llocs a prop","es":"Sitios cerca","fr":"Lieux à proximité"},"Places to eat":{"ca":"Llocs per menjar","es":"Sitios para comer","fr":"Où manger"},"Progress":{"ca":"Progrés","es":"Progreso","fr":"Progression"},"Publish":{"ca":"Publica","es":"Publicar","fr":"Publier"},"Publish my guide":{"ca":"Publica la meva guia","es":"Publicar mi guía","fr":"Publier mon guide"},"Publish your guide":{"ca":"Publica la teva guia","es":"Publica tu guía","fr":"Publi  revisión","fr":"Votre vérification"},"Rubbish tonight":{"ca":"Escombraries d’aquesta nit","es":"Basura de esta noche","fr":"Déchets de ce soir"},"Search for events":{"ca":"Busca esdeveniments","es":"Buscar eventos","fr":"Chercher des événements"},"Search the guide":{"ca":"Busca a la guia","es":"Buscar en la guía","fr":"Chercher dans le guide"},"Search the guide: wifi, bins, beach…":{"ca":"Busca a la guia: wifi, escombraries, platja…","es":"Busca en la guía: wifi, basura, playa…","fr":"Chercher dans le guide : wifi, poubelles, plage…"},"See it on Google Maps":{"ca":"Mira-ho a Google Maps","es":"Verlo en Google Maps","fr":"Voir sur Google Maps"},"Sending":{"ca":"Enviant","es":"Enviando","fr":"Envoi"},"Sending…":{"ca":"Enviant…","es":"Enviando…","fr":"Envoi…"},"Sent":{"ca":"Enviat","es":"Enviado","fr":"Envoyé"},"Sent! Opening your preview…":{"ca":"Enviat! Obrint la vista prèvia…","es":"¡Enviado! Abriendo tu vista previa…","fr":"Envoyé ! Ouverture de votre aperçu…"},"Sent! We start building your guide.":{"ca":"Enviat! Comencem a fer la teva guia.","es":"¡Enviado! Empezamos a crear tu guía.","fr":"Envoyé ! Nous commençons à créer votre guide."},"Share it with guests":{"ca":"Comparteix-la amb els hostes","es":"Compártela con tus huéspedes","fr":"Partagez-le avec vos voyageurs"},"Share the link in your welcome message and print the QR card for the house.":{"ca":"Comparteix l’enllaç al missatge de benvinguda i imprimeix la targeta QR per a la casa.","es":"Comparte el enlace en tu mensaje de bienvenida e imprime la tarjeta QR para la casa.","fr":"Partagez le lien dans votre message d’accueil et imprimez la carte QR pour la maison."},"Show all":{"ca":"Mostra-ho tot","es":"Mostrar todo","fr":"Tout voir"},"Sign in to save your answers":{"ca":"Inicia la sessió per desar les respostes","es":"Inicia sesión para guardar tus respuestas","fr":"Connectez-vous pour enregistrer vos réponses"},"So you can come back any time and change your answers. It takes a minute.":{"ca":"Així pots tornar quan vulguis i canviar les respostes. Només és un minut.","es":"Así puedes volver cuando quieras y cambiar tus respuestas. Solo es un minuto.","fr":"Pour revenir quand vous voulez et modifier vos réponses. Cela prend une minute."},"Something did not go through. Check your connection and press Send again.":{"ca":"Alguna cosa no ha arribat. Comprova la connexió i torna a prémer Envia.","es":"Algo no ha llegado. Comprueba tu conexión y vuelve a pulsar Enviar.","fr":"Quelque chose n’est pas passé. Vérifiez votre connexion et appuyez à nouveau sur Envoyer."},"Something went wrong while building your guide.":{"ca":"Alguna cosa ha fallat en crear la teva guia.","es":"Algo ha fallado al crear tu guía.","fr":"Un problème est survenu pendant la création de votre guide."},"Status":{"ca":"Estat","es":"Estado","fr":"Statut"},"Still looking. Press Refresh in a while.":{"ca":"Encara buscant. Prem Actualitza d’aquí a una estona.","es":"Seguimos buscando. Pulsa Actualizar dentro de un rato.","fr":"Recherche en cours. Appuyez sur Actualiser dans un moment."},"Still waiting to start. Our service may be busy or paused: it starts by itself as soon as it can.":{"ca":"Encara esperant per començar. El nostre servei pot estar ocupat o aturat: començarà sol tan aviat com pugui.","es":"Aún esperando para empezar. Nuestro servicio puede estar ocupado o en pausa: empezará solo en cuanto pueda.","fr":"Toujours en attente de démarrage. Notre service est peut-être occupé ou en pause : il démarrera de lui-même dès que possible."},"Still waiting. Check again in a while.":{"ca":"Encara esperant. Torna-ho a mirar d’aquí a una estona.","es":"Aún esperando. Vuelve a mirar dentro de un rato.","fr":"Toujours en attente. Revenez voir dans un moment."},"Storage full. Remove a photo.":{"ca":"Emmagatzematge ple. Treu una foto.","es":"Almacenamiento lleno. Quita una foto.","fr":"Stockage plein. Retirez une photo."},"Suggestion":{"ca":"Suggeriment","es":"Sugerencia","fr":"Suggestion"},"Taking a bit longer than usual, still working…":{"ca":"Triga una mica més del normal, encara treballant…","es":"Tarda un poco más de lo normal, seguimos trabajando…","fr":"Un peu plus long que d’habitude, toujours en cours…"},"Taxi":{"ca":"Taxi","es":"Taxi","fr":"Taxi"},"Taxi name":{"ca":"Nom del taxi","es":"Nombre del taxi","fr":"Nom du taxi"},"Train":{"ca":"Tren","es":"Tren","fr":"Train"},"Texts and tone":{"ca":"Textos i to","es":"Textos y tono","fr":"Textes et ton"},"Thank you!":{"ca":"Gràcies!","es":"¡Gracias!","fr":"Merci !"},"Thank you. Your preview is ready.":{"ca":"Gràcies. La teva vista prèvia està a punt.","es":"Gracias. Tu vista previa está lista.","fr":"Merci. Votre aperçu est prêt."},"That web address is taken. Choose one of the free ones above.":{"ca":"Aquesta adreça web ja està agafada. Tria’n una de les lliures de dalt.","es":"Esa dirección web ya está cogida. Elige una de las libres de arriba.","fr":"Cette adresse web est déjà prise. Choisissez une des adresses libres ci-dessus."},"Choose a web address for your guide above.":{"ca":"Tria una adreça web per a la teva guia a dalt.","es":"Elige arriba una dirección web para tu guía.","fr":"Choisissez ci-dessus une adresse web pour votre guide."},"The blue of the sea, the hand-drawn feel…":{"ca":"El blau del mar, l’aire de dibuix fet a mà…","es":"El azul del mar, el aire de dibujo hecho a mano…","fr":"Le bleu de la mer, l’effet dessiné à la main…"},"The build did not work":{"ca":"La creació no ha funcionat","es":"La creación no ha funcionado","fr":"La création n’a pas fonctionné"},"The drawing did not work. Try again.":{"ca":"El dibuix no ha funcionat. Torna-ho a provar.","es":"El dibujo no ha funcionado. Vuelve a intentarlo.","fr":"Le dessin n’a pas fonctionné. Réessayez."},"The drawing is made for your account, so it comes after you save your guide.":{"ca":"El dibuix es fa per al teu compte, així que arriba després de desar la guia.","es":"El dibujo se hace para tu cuenta, así que llega después de guardar tu guía.","fr":"Le dessin est fait pour votre compte : il vient donc après l’enregistrement de votre guide."},"The food you recommend":{"ca":"El menjar que recomanes","es":"La comida que recomiendas","fr":"La cuisine que vous recommandez"},"The places you like":{"ca":"Els llocs que t’agraden","es":"Los sitios que te gustan","fr":"Les lieux que vous aimez"},"The things you suggest":{"ca":"Les coses que suggereixes","es":"Las cosas que sugieres","fr":"Ce que vous suggérez"},"The guide does not know where the house is.":{"ca":"La guia no sap on és la casa.","es":"La guía no sabe dónde está la casa.","fr":"Le guide ne sait pas où se trouve la maison."},"We need the town first.":{"ca":"Primer necessitem el poble.","es":"Primero necesitamos la población.","fr":"Il nous faut d’abord la ville."},"Places are not set up yet.":{"ca":"Els llocs encara no estan configurats.","es":"Los sitios aún no están configurados.","fr":"Les lieux ne sont pas encore configurés."},"The image could not be read":{"ca":"No s’ha pogut llegir la imatge","es":"No se ha podido leer la imagen","fr":"L’image n’a pas pu être lue"},"The photo could not be uploaded":{"ca":"No s’ha pogut pujar la foto","es":"No se ha podido subir la foto","fr":"La photo n’a pas pu être importée"},"The last search found nothing new nearby.":{"ca":"L’última cerca no ha trobat res de nou a prop.","es":"La última búsqueda no ha encontrado nada nuevo cerca.","fr":"La dernière recherche n’a rien trouvé de nouveau à proximité."},"The more specific you are, the more different your guide looks. We design a look just for you, not from a template.":{"ca":"Com més concret siguis, més diferent serà la teva guia. Dissenyem un estil només per a tu, no a partir d’una plantilla.","es":"Cuanto más concreto seas, más distinta será tu guía. Diseñamos un estilo solo para ti, no a partir de una plantilla.","fr":"Plus vous êtes précis, plus votre guide sera différent. Nous créons un style rien que pour vous, pas à partir d’un modèle."},"The pool has no fence, the stairs are steep…":{"ca":"La piscina no té tanca, les escales són dretes…","es":"La piscina no tiene valla, las escaleras son empinadas…","fr":"La piscine n’a pas de clôture, l’escalier est raide…"},"The rooms, in your order":{"ca":"Les estances, en el teu ordre","es":"Las estancias, en tu orden","fr":"Les pièces, dans votre ordre"},"Thing: how it works":{"ca":"Cosa: com funciona","es":"Cosa: cómo funciona","fr":"Élément : comment il fonctionne"},"This can take up to a minute. Please keep this page open.":{"ca":"Pot trigar fins a un minut. Mantén aquesta pàgina oberta.","es":"Puede tardar hasta un minuto. Mantén esta página abierta.","fr":"Cela peut prendre jusqu’à une minute. Gardez cette page ouverte."},"This did not work.":{"ca":"Això no ha funcionat.","es":"Esto no ha funcionado.","fr":"Cela n’a pas fonctionné."},"This guide has no contacts yet.":{"ca":"Aquesta guia encara no té contactes.","es":"Esta guía aún no tiene contactos.","fr":"Ce guide n’a pas encore de contacts."},"This picture has no colours we can use (only black, white or grey)":{"ca":"Aquesta imatge no té colors que puguem fer servir (només negre, blanc o gris)","es":"Esta imagen no tiene colores que podamos usar (solo negro, blanco o gris)","fr":"Cette image n’a pas de couleurs utilisables (seulement du noir, du blanc ou du gris)"},"Time and the short list before leaving.":{"ca":"L’hora i la llisteta abans de marxar.","es":"La hora y la lista corta antes de irse.","fr":"L’heure et la petite liste avant de partir."},"Tourist traps, chains, places that need a car…":{"ca":"Paranys per a turistes, cadenes, llocs on cal cotxe…","es":"Trampas para turistas, cadenas, sitios que necesitan coche…","fr":"Pièges à touristes, chaînes, lieux où il faut une voiture…"},"What you never recommend":{"ca":"El que no recomanes mai","es":"Lo que nunca recomiendas","fr":"Ce que vous ne recommandez jamais"},"Translating":{"ca":"Traduint","es":"Traduciendo","fr":"Traduction"},"Translating into your languages":{"ca":"Traduint als teus idiomes","es":"Traduciendo a tus idiomas","fr":"Traduction dans vos langues"},"Translation":{"ca":"Traducció","es":"Traducción","fr":"Traduction"},"Translations and other small changes are waiting.":{"ca":"Hi ha traduccions i altres canvis petits pendents.","es":"Hay traducciones y otros cambios pequeños pendientes.","fr":"Des traductions et d’autres petites modifications attendent."},"Try again":{"ca":"Torna-ho a provar","es":"Volver a intentarlo","fr":"Réessayer"},"Try it on your phone":{"ca":"Prova-la al mòbil","es":"Pruébala en tu móvil","fr":"Essayez-le sur votre téléphone"},"Try it like a guest and tell us what you think. Then we research your area and email the full guide to":{"ca":"Prova-la com un hoste i explica’ns què en penses. Després investiguem la teva zona i enviem la guia completa a","es":"Pruébala como un huésped y cuéntanos qué te parece. Después investigamos tu zona y enviamos la guía completa a","fr":"Essayez-le comme un voyageur et dites-nous ce que vous en pensez. Ensuite, nous étudions vos environs et envoyons le guide complet à"},"Type its name, or paste its Google Maps link.":{"ca":"Escriu-ne el nom o enganxa’n l’enllaç de Google Maps.","es":"Escribe su nombre o pega su enlace de Google Maps.","fr":"Tapez son nom, ou collez son lien Google Maps."},"Up to three short reviews, one per line, with the first name after a dash. Only add reviews you are happy to share.":{"ca":"Fins a tres ressenyes curtes, una per línia, amb el nom de pila després d’un guionet. Afegeix només les que vulguis compartir.","es":"Hasta tres reseñas cortas, una por línea, con el nombre de pila tras un guion. Añade solo las que quieras compartir.","fr":"Jusqu’à trois avis courts, un par ligne, avec le prénom après un tiret. N’ajoutez que des avis que vous souhaitez partager."},"Uploading":{"ca":"Pujant","es":"Subiendo","fr":"Importation"},"Uploading…":{"ca":"Pujant…","es":"Subiendo…","fr":"Importation…"},"Use this cover":{"ca":"Fes servir aquesta porta // One screen of the guide as guests will see it, built from the answers: the cover, the name, the sections. Used by the

async function pvParts(screen){

  const own = (uploads.find(u => u.kind === 'cover') || {}).url, listing = A.coverChoice !== 'drawn' && A.coverUrl ? String(A.coverUrl).split('?')[0] + '?im_w=720' : '';

    if (f === 'How to get in' && v('arrival')) facts.push(['arrival', 'Getting here', 'Directions']);
    if (f === 'House guide') facts.push(['houseguide', 'House guide', 'How things work']);
    if (f === 'Places to eat') facts.push(['eat', 'Eat', lines('favourites').length + ' favourites']);
  }

  const atHouse = ['rubbish', 'houseguide', 'emergency'].map(id => S.find(x => x.id === id)).filter(Boolean), around = S.filter(x => !atHouse.includes(x) && !['house', 'wifi', 'stay', 'arrival'].includes(x.id));
  const tile = (x, i, wide) => `<button type="button" class="pv-sec${wide ? ' wide' : ''}${light(colours[i % colours.length]) ? ' lt' : ''}" data-pv="${x.id}" data-q="${esc((x.title + ' ' + x.sub + ' ' + (x.items || []).join(' ')).toLowerCase())}" style="--sc:${colours[i % colours.length]};--ss:${shapes[i % shapes.length]};--st:${light(colours[i % colours.length]) ? p.ink : '#fff'}"><span class="ic">${I[x.icon] || ''}</span><span class="tx"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span><span class="ar" aria-hidden="true">→</span></button>`;
  const group = (list, title, from) => list.length ? `<h2 class="pv-h">${esc(title)}</h2><div class="pv-secs">${list.map((x, i) => tile(x, from + i, ['bold', 'soft', 'mediterranean', 'rural'].includes(preset) && i === list.length - 1 && list.length % 2 === 1)).join('')}</div>` : '';
  const ph = id => { const r = (S.find(x => x.id === 'houseguide') || {}).rooms || []; return id === 'houseguide' && r.find(x => x.photos.length) ? r.find(x => x.photos.length).photos[0] : null; };

    ${/search/i.test(v('navStyle')) ? `<input class="pv-search" id="pvSearch" placeholder="Search the guide: wifi, bins, beach…" aria-label="Search the guide">` : ''}

async function phoneRender(){

  const scr = ordered(guideSections()).some(x => x.id === PHONE.screen) ? PHONE.screen : 'home';

// Claude looks at the photos and proposes a room for each one that has none yet. The host confirms.
async function classifyPhotos(){
  const todo = uploads.filter(u => u.remote && !u.room);
  if (!todo.length) return;
  try {
    const r = await fetch('/api/photorooms', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ photos: todo.map(u => u.src) }) });
    const d = await r.json(); if (!d.ok) return;
    todo.forEach((u, i) => { if (d.rooms[i] && !u.room) { u.room = d.rooms[i]; saveUpload(u); } });
    queueSave(); render();
  } catch (e) { /* the host can tag the rooms by hand */ }
}


/* ---------- Rooms and photos: one card per room, a viewer, and a way to start over ---------- */
function catOf(n){
  n = String(n || '').trim(); if (ROOMS.includes(n)) return n;
  const t = [[/bed|dormit|habitaci|chambre|cambra|schlafzimmer|slaapkamer/i, 'Bedroom'], [/bath|ba[ñn]o|\bbany|salle de bain|shower|toilet|\bwc\b|restroom/i, 'Bathroom'], [/kitchen|cocina|cuina|cuisine|k[üu]che|keuken/i, 'Kitchen'], [/living|lounge|sitting|sal[oó]n|\bsala\b|dining|comedor|menjador|wohnzimmer|woonkamer/i, 'Living room'], [/pool|piscin/i, 'Pool'], [/garden|yard|lawn|jard[ií]/i, 'Garden'], [/terrace|terraza|terrassa|balc[oó]n|patio|porch/i, 'Terrace'], [/office|study|work|despacho/i, 'Office'], [/laundry|utility|colada|lavander/i, 'Laundry'], [/view|vistas?\b/i, 'View'], [/exterior|outside|entrance|facade|fachada|front|parking|garaje|garage/i, 'Outside']].find(x => x[0].test(n));
  return t ? t[1] : 'Other';
}
// A.rooms keeps the order, the names and what the host wrote: [{ n: name, c: kind of room (ROOMS), t: what guests should
// know there }]. A photo belongs to a room by its name (roomLabel). A room no photo is in stays once it is in A.rooms.
const sameRoom = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
const photoRoom = u => String(u.roomLabel || u.room || '').trim();
const noRoom = n => !n || n === 'Other';
const photosIn = n => uploads.filter(u => u.kind === 'photo' && sameRoom(photoRoom(u), n));
function roomsNow(){
  const out = (Array.isArray(A.rooms) ? A.rooms : []).filter(r => r && r.n).map(r => ({ ...r }));
  uploads.filter(u => u.kind === 'photo').forEach(u => { const n = photoRoom(u); if (!noRoom(n) && !out.some(r => sameRoom(r.n, n))) out.push({ n, c: u.room && u.room !== 'Other' ? u.room : catOf(n), t: '' }); });
  if (!out.length && !Array.isArray(A.rooms)) {   // no listing to read them from: the usual rooms, to start from
    const num = (k, label) => { const c = parseInt(v(k), 10); return c > 1 && c <= 12 ? Array.from({ length: c }, (_, i) => label + ' ' + (i + 1)) : [label]; };
    ['Living room', 'Kitchen', ...num('bedrooms', 'Bedroom'), ...num('bathrooms', 'Bathroom')].forEach(n => out.push({ n, c: catOf(n), t: '' }));
  }
  return out;
}
const roomsKeep = () => { A.rooms = roomsNow(); };   // before a photo leaves a room: the room stays, with its place in the order
const roomKind = n => (roomsNow().find(r => sameRoom(r.n, n)) || { c: catOf(n) }).c;
function roomChoices(){ return roomsNow().map(r => r.n); }
function setRoom(u, val){ roomsKeep(); u.roomLabel = val; u.room = val ? roomKind(val) : ''; saveUpload(u); queueSave(); }
const roomThumb = u => `<div class="thumb"><img src="${esc(srcOf(u))}" alt="${esc(u.name)}" loading="lazy" data-lbid="${u.id}"><button class="x" type="button" data-del="${u.id}" aria-label="Remove this photo">×</button></div>`;
function roomCard(r, i, all){
  const nm = esc(r.n), ph = photosIn(r.n), pend = [...pending.values()].filter(p => p.kind === 'photo' && sameRoom(p.into, r.n));
  return `<section class="rm" data-rmi="${i}" data-drop="photo" data-max="${UP.photo.max}" data-rmto="${nm}">

}
function roomsInner(){
  const list = roomsNow(), loose = uploads.filter(u => u.kind === 'photo' && noRoom(photoRoom(u)));
  return `${list.map((r, i) => roomCard(r, i, list.length)).join('')}

function roomsPut(list){ A.rooms = list; queueSave(); const b = document.getElementById('roomsBox'); if (b) b.innerHTML = roomsInner(); softRefresh(); phoneSoon(); }
function roomAdd(){
  const el = document.getElementById('rmNew'), n = el ? el.value.trim() : '', list = roomsNow(); if (!n) return;
  if (list.some(r => sameRoom(r.n, n))) { toast('You already have a room with that name'); return; }

document.addEventListener('click', e => {

  const i = +b.dataset.rmmove, j = i + Number(b.dataset.dir); if (j < 0 || j >= list.length) return;

const SB = { url: 'https://dmoxszfwulolqkgxtxcp.supabase.co', key: 'sb_publishable_4esKE09oxNusDwlEPNdeWg_sUroV5Kr' };   // public values: the database rules decide who sees what
const AUTH_KEY = 'porta-auth-v1';
let AUTH = null, GUIDE = null, pushTimer = null, pushing = false, pushAgain = false;
function authLoad(){ try { AUTH = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { AUTH = null; } }
function authStore(s){ AUTH = s; try { s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} }
async function sb(path, o = {}){
  const r = await fetch(SB.url + path, { method: o.method || 'GET', headers: { apikey: SB.key, 'Content-Type': 'application/json', Authorization: 'Bearer ' + (o.token || (AUTH && AUTH.access_token) || SB.key), ...(o.headers || {}) }, body: o.body ? JSON.stringify(o.body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const er = new Error((j && (j.msg || j.error_description || j.message || j.error)) || ('HTTP ' + r.status)); er.status = r.status; er.body = j; throw er; }
  return j;
}
function toSession(j){ return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user }; }
async function ensureFresh(){
  if (!AUTH) throw new Error('no session');
  if (AUTH.expires_at * 1000 - Date.now() > 60000) return;
  const j = await sb('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: AUTH.refresh_token }, token: SB.key });
  authStore(toSession(j));
}
function niceError(e){
  const m = String(e && e.message || '');
  if (/invalid login/i.test(m)) return 'Wrong email or password.';
  if (/already registered|already been registered/i.test(m)) return 'This email already has an account. Log in instead.';
  if (/password/i.test(m) && /(6|8|short|weak|least)/i.test(m)) return 'Choose a password of at least 8 characters.';
  if (/rate limit|too many/i.test(m)) return 'Too many tries. Wait a minute and try again.';
  if (/email/i.test(m) && /(valid|invalid)/i.test(m)) return 'That email address does not look right.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection. Check your internet and try again.';
  return m || 'Something went wrong. Try again.';
}

  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', [0.84,0.76,0.68,0.6,0.55,0.5][k]));

  const list = [...files].slice(0, Math.max(0, max - have));

      <div class="f"><label for="fb_wrong">What is wrong or missing</label><textarea id="fb_wrong" name="wrong" rows="4" placeholder="The bakery closed last year, I want the pool first…"></textarea></div>
      <div class="f"><label for="fb_ux">How would you like it to look or work instead?</label><textarea id="fb_ux" name="ux" rows="3" placeholder="Bigger photos, a list instead of tiles, the map first…"></textarea></div>
      <div class="f"><span class="lab">Where</span><div class="chips">${['Look and colours','Layout','Texts and tone','Wrong information','Missing places','Photos','Languages','Navigation'].map(x => `<label class="chip"><input type="checkbox" name="areas" value="${x}"><span>${x}</span></label>`).join('')}</div></div>
      <div class="f"><label for="fb_shot">A screenshot <span class="opt">optional</span></label><input id="fb_shot" name="shot" type="file" accept="image/*"></div>
      <div class="f"><span class="lab">Next step</span><div class="chips"><label class="chip"><input type="radio" name="next" value="changes" checked><span>Make these changes</span></label><label class="chip"><input type="radio" name="next" value="publish"><span>It is ready, publish it</span></label></div></div>
      <div class="f"><label for="fb_email">Your email</label><input id="fb_email" name="email" type="email" value="${esc(v('email'))}" required></div>
      <div><button class="btn primary" type="submit">Send feedback</button></div></form>`;
}

/* ---------- Render ---------- */
let lastRoute = null;
function render(){
  if (/(^|[#&])(access_token|error_description)=/.test(location.hash)) return;   // a sign-in link: accountBoot reads it first
  let r = route(); const main = $('#main');
  if (!main) return;
  clearInterval(buildTimer);
  const ae = document.activeElement, fid = ae && ae.id, sel = ae && ae.selectionStart;
  const m = visible().find(x => x.id === r);
  const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
  if (path && path !== 'index.html' && CM.on) { location.replace('/g/' + encodeURIComponent(CM.g.slug)); return; }
  if (path && path !== 'index.html') { if (path === v('slug') || path === 'preview') { renderPreview(); return; } main.innerHTML = notHereHTML(path); return; }
  if (CM.on && !cmIsPage(r)) { history.replaceState(null, '', '#' + cmStart()); r = route(); }   // no overview: the editor opens on a step
  if (CM.on) { main.innerHTML = cmPageHTML(r); cmRemember(r); cmPhoneOn(); }   // the guide exists: the steps edit it (editor.js)
  else if (new URLSearchParams(location.search).has('feedback')) main.innerHTML = feedbackPageHTML();
  else if (r === 'building' || (A._sentAt && !location.hash && window.__acctGuide && window.__acctGuide() && window.__acctGuide().status !== 'draft')) { main.innerHTML = buildingHTML(); watchBuild(); }
  else if (r === 'thanks' || (A._sentAt && !location.hash)) main.innerHTML = thanksHTML();
  else if (r === 'yours') { main.innerHTML = yoursHTML(); phoneRender(); if (r !== lastRoute) log('open', 'yours'); }   // the wow: the guide in a phone
  else if (m) { main.innerHTML = moduleHTML(m); PHONE.screen = (m.id === 'known' && KN.screen) || STEP_SCREEN[m.id] || 'home'; PHONE.build = false; phoneRender(); if (r !== lastRoute) log('open', m.id); if (A._last !== m.id || !(A._seen || []).includes(m.id)) { A._last = m.id; markSeen(m.id); } queueSave(); }
  else if (r === 'send') { main.innerHTML = sendHTML(); if (r !== lastRoute) { log('open', 'send'); queueSave(); } }
  else if ((r === 'home' || r === 'start') && (r === 'start' || (!A._draftAt && !A._skipStart && !visible().some(m => statusOf(m).k !== 'new')))) { main.innerHTML = startHTML(); if (r !== lastRoute) { log('open', 'start'); queueSave(); } }
  else { history.replaceState(null, '', '#' + obNext()); return render(); }   // no overview page: straight to the next step
  let nb = document.getElementById('navbar'); if (!nb) { nb = document.createElement('div'); nb.id = 'navbar'; nb.hidden = true; document.body.appendChild(nb); }
  const stepView = CM.on ? cmIsPage(r) : r === 'send' || !!m;
  nb.hidden = !stepView || new URLSearchParams(location.search).has('feedback') || (r === 'thanks');
  if (!nb.hidden) nb.innerHTML = navbarHTML(r);
  if (r !== lastRoute && document.getElementById('f_slug')) slugLater();
  if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
  fixRail(); setTimeout(fixRail, 60);
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
}
function softRefresh(){
  const m = MODULES.find(x => x.id === route());
  if (!m) return;
  const s = statusOf(m), miss = missingOf(m);
  const p = document.querySelector('.mhead .pill'); if (p) { p.className = 'pill ' + s.k; p.innerHTML = (s.k === 'done' ? CHECK : '') + esc(s.label); }
  const d = document.querySelector('[data-done]'); if (d) d.disabled = !!miss.length;
  const t = document.querySelector('.foot .todo'); if (t) t.innerHTML = miss.length ? `Still needed for Done: <b>${miss.map(k => esc(NAME(k))).join(', ')}</b>` : s.k === 'done' ? 'This step is done. You can still change anything.' : 'Everything needed is here. Press Done when you are happy with it.';
  document.querySelectorAll('[data-k],[data-multi],[data-radio]').forEach(el => { const k = el.dataset.k || el.dataset.multi || el.dataset.radio; const f = el.closest('.f'); const b = f && f.querySelector('.req'); if (b) b.outerHTML = badge(k); });
  if (m.id === 'known') knownTicks();
  refreshNav();
}
window.addEventListener('hashchange', render);
function refreshSend(){ if (route() !== 'send') return; refreshNav(); const miss = sendMissing(); const b = $('#send'); if (b) b.disabled = !!miss.length; const tt = document.querySelector('.foot .todo'); if (tt) tt.innerHTML = miss.length ? `Before sending: <b>${miss.map(esc).join(', ')}</b>` : ''; }

/* ---------- Events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k === 'slug') { const c = cleanSlug(t.value); if (c !== t.value) { const p0 = t.selectionStart; t.value = c; try { t.setSelectionRange(p0, p0); } catch (er) {} } set('slug', c); A._slugTouched = true; slugCheck(); softRefresh(); refreshSend(); slugLater(); return; }
  if (t.dataset.k && A._pre && A._pre[t.dataset.k]) { const p = { ...A._pre }; delete p[t.dataset.k]; A._pre = p; }
  if (t.dataset.k) { set(t.dataset.k, t.value); if ((t.dataset.k === 'guideName' || t.dataset.k === 'placeName') && !A._slugTouched) slugAuto(); if (route() === 'send') refreshSend(); else softRefresh(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.dataset.multi || t.dataset.radio) && A._pre && A._pre[t.dataset.multi || t.dataset.radio]) { const p = { ...A._pre }; delete p[t.dataset.multi || t.dataset.radio]; A._pre = p; }
  if (t.dataset.multi) { const k = t.dataset.multi, cur = new Set(A[k] || []); t.checked ? cur.add(t.value) : cur.delete(t.value); set(k, [...cur]); softRefresh(); }
  else if (t.dataset.radio) { set(t.dataset.radio, t.value); softRefresh(); refreshSend(); }
  else if (t.dataset.k && t.tagName === 'SELECT') { set(t.dataset.k, t.value); softRefresh(); }
  else if (t.dataset.sec) { A.modules = { ...Object.fromEntries(SECTIONS.map(s => [s.id, secOn(s.id)])), [t.dataset.sec]: t.checked }; queueSave(); lookRefresh().then(refreshNav); }   // in The look: the steps and the phone follow, the page stays where it is
  else if (t.dataset.check) { set(t.dataset.check, t.checked); refreshSend(); }
  else if (t.dataset.file) { const d = t.closest('[data-drop]'); addFiles(t.dataset.file, t.files, +d.dataset.max, d.dataset.rmto); t.value = ''; }
  else if (t.dataset.room) { const u = uploads.find(x => x.id === t.dataset.room); if (u) setRoom(u, t.value); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.donenext) { const id = b.dataset.donenext; A._done = { ...(A._done || {}), [id]: true }; log('done', id); queueSave(); const o = stepsOrder(); const nx = o[o.indexOf(id) + 1]; toast('Done'); location.hash = '#' + (nx || 'home'); render(); }
  else if (b.id === 'openSteps') openSteps();
  else if (b.id === 'skipStart') { A._skipStart = true; queueSave(); location.hash = '#listing'; render(); }
  else if (b.dataset.done) { A._done = { ...(A._done || {}), [b.dataset.done]: true }; log('done', b.dataset.done); queueSave(); render(); toast('Done'); }
  else if (b.dataset.undone) { const d = { ...(A._done || {}) }; delete d[b.dataset.undone]; A._done = d; log('reopen', b.dataset.undone); queueSave(); render(); }
  else if (b.dataset.del) { roomsKeep(); uploads = uploads.filter(x => x.id !== b.dataset.del); try { await idb.del(b.dataset.del); } catch (err) {} render(); }
  else if (b.id === 'send') send(b);
  else if (b.dataset.slug) { SLUG = { for: b.dataset.slug, free: true, options: [] }; set('slug', b.dataset.slug); A._slugTouched = true; slugCheck(); softRefresh(); refreshSend(); }
  else if (b.id === 'fillListing') { const got = applyListing(); const mods = [...new Set(got.map(k => FIELD_MODULE[k]))].map(id => (MODULES.find(m => m.id === id) || {}).title).filter(Boolean); render(); toast(got.length ? `Filled ${got.length} answers in ${mods.join(', ')}. Marked “Review”.` : 'Nothing new found. Try pasting more of the listing.'); }
  else if (b.id === 'openPreview') { flush(); location.href = '/' + (v('slug') || 'preview'); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fb') return;
  e.preventDefault();
  const f = new FormData(e.target), p = new URLSearchParams(location.search);
  const btn = e.target.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const shot = f.get('shot');
    const d = device();
    const fields = { device: deviceLine(d), device_json: JSON.stringify(d), sid: p.get('feedback') || sid, guide: p.get('guide') || '', round: p.get('round') || '1', email: f.get('email'), rating: f.get('rating'), right: f.get('right'), wrong: f.get('wrong'), ux: f.get('ux'), areas: f.getAll('areas').join(', '), next: f.get('next') };
    if (shot && shot.size) { const blob = await shrink(shot, 1800, 1.5e6); await nf('feedback', fields, { blob, name: 'screenshot.jpg' }); }
    else await nf('feedback', fields);
    e.target.outerHTML = `<section class="card"><h2 style="font-size:28px">Thank you!</h2><p class="hint" style="font-size:16px">We read every word and send you the next version soon.</p></section>`;
  } catch (err) { btn.disabled = false; btn.textContent = 'Send feedback'; toast('Could not send. Try again.'); }
});
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault();
  d.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files.length) addFiles(d.dataset.drop, e.dataTransfer.files, +d.dataset.max, d.dataset.rmto);
}));
async function send(b){
  b.disabled = true;
  const st = $('#sendState');
  try {
    log('send'); const d = device(), j = journey();
    const clean = { ...A }; delete clean._notes; delete clean._log;
    const files = uploads.filter(x => !x.remote && x.blob), acct = window.__acctQueueBuild && window.__acctGuide && window.__acctGuide();   // a picture already in the account's storage has no file on this device
    const total = files.length + 1; let n = 0;
    const tick = () => { n++; if (st) st.textContent = `Sending ${n} of ${total}…`; };
    tick();
    // With an account the guide is built from the account: this copy to us must never stop it.
    try {
      await nf('onboarding', { sid, email: v('email') || (AUTH && AUTH.user && AUTH.user.email) || '', place: v('placeName'), town: v('town'), slug: v('slug'), progress: progressText(), photos: String(uploads.length), listing_photos: JSON.stringify(uploads.filter(u => u.remote).map(u => ({ url: u.src, room: u.room || '', caption: u.name }))),
        device: deviceLine(d), device_type: d.type, device_json: JSON.stringify(d), active_minutes: String(j.activeMinutes), journey: JSON.stringify(j), events: JSON.stringify(A._log || []),
        sent_before: A._sentAt || '', answers: JSON.stringify(clean) });
      for (const u of files) { tick(); await nf('file', { sid, kind: u.kind, room: u.room || '', name: u.name }, u); }
    } catch (e) { if (!acct) throw e; }
    A._sentAt = new Date().toISOString(); flush();
    if (acct) {
      try { st && (st.textContent = 'Starting your guide…'); await window.__acctQueueBuild(); location.hash = 'building'; render(); return; }
      catch (e) { b.disabled = false; if (st) st.textContent = e.message || 'Could not start your guide. Try again.'; return; }
    }
    toast('Sent! Opening your preview…'); setTimeout(() => { location.href = '/' + (v('slug') || 'preview'); }, 900);
  } catch (err) { b.disabled = false; if (st) st.textContent = 'Something did not go through. Check your connection and press Send again.'; }
}

// Save straight away when the page is hidden or closed (phones kill tabs without warning).
addEventListener('pagehide', () => { clearTimeout(saveTimer); flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(saveTimer); flush(); } });

/* ---------- Boot ---------- */
(async () => {
  try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) { A = saved.A || {}; sid = saved.sid; } } catch (e) {}
  if (!sid) sid = newId();
  { const d = device(); A._sessions = [...(A._sessions || []), { t: Date.now(), d: deviceLine(d) }].slice(-50); log('session', null, { d: deviceLine(d) }); flush(); }
  try { uploads = (await idb.all() || []).map(u => ({ ...u, url: u.blob ? URL.createObjectURL(u.blob) : u.url })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')); } catch (e) { uploads = []; }
  try { await accountBoot(); } catch (e) {}
  setSave('ok', CM.on ? cmSaveText() : A._seen ? 'Saved on this device' : 'Answers save on this device');
  render();
  if (!CM.on) areaWatch();   // the research from the link, when it is still on its way
})();

})();
</script>

  <input name="areas"><input name="next"><input name="kind"><input name="screen"><input name="preset"><input name="device"><textarea name="device_json"></textarea><input type="file" name="file"><input name="bot">
