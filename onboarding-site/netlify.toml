[build]
  publish = "."
  # Static site + functions. The one build step: the shared viewer's page (g-app/viewer.html, committed with a placeholder)
  # gets the Google Maps browser key for Google's hours card from the Netlify variable GOOGLE_MAPS_BROWSER_KEY (set in
  # Netlify, never in git); empty when the variable is not set, which means no card.
  command = 'sed -i "s|__GOOGLE_MAPS_BROWSER_KEY__|${GOOGLE_MAPS_BROWSER_KEY:-}|g" g-app/viewer.html'
  # Only redeploy when the onboarding site itself changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Guides loaded from the database: /g/<name> opens the shared viewer (built into g-app/).
[[redirects]]
  from = "/g/*"
  to = "/g-app/viewer.html"
  status = 200

# Every guide address (/villa-mar) opens the app, which shows that host's preview.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
