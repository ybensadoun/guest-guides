# Netlify project for this site: set "Base directory" to sites/ca-la-kimberly in the Netlify UI.
# The build runs from the repo root so it uses the shared engine. Since 23 Oct 2026 this address serves the shared viewer built
# for this one guide (npm run build-guide): the content comes live from the database (/g/ca-la-kimberly), so content changes
# (npm run guide:push -- ca-la-kimberly, the editor, the monthly check) need no deploy. Rollback: Deploys > an older deploy > Publish deploy.
[build]
  command = "cd ../.. && npm ci && npm run build-guide -- ca-la-kimberly"
  publish = "dist"
  # Skip the build when neither this site nor the shared engine changed (other sites' pushes do not redeploy this one).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../engine ../../onboarding-site/g-sw.js ../../package.json ../../package-lock.json"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
