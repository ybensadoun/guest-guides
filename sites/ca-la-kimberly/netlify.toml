# Netlify project for this site: set "Base directory" to sites/ca-la-kimberly in the Netlify UI.
# The build runs from the repo root so it uses the shared engine.
[build]
  command = "cd ../.. && npm ci && npm run build -- ca-la-kimberly"
  publish = "dist"
  # Skip the build when neither this site nor the shared engine changed (other sites' pushes do not redeploy this one).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../engine ../../package.json ../../package-lock.json"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
