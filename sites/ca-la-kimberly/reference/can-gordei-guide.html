<title>Can Gordei · Guest guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F6F6F3;--surface:#FFFFFF;--ink:#141517;--muted:#6B6E73;--faint:#9A9CA0;--line:#E7E7E2;
  --accent:#D4472B;--accent-soft:#FBE8E2;--on-accent:#FFFFFF;
  --c-covered:#2563A8;--c-covered-s:#E7F0FA;
  --c-street:#C2410C;--c-street-s:#FDEBDF;
  --c-flea:#A86A12;--c-flea-s:#FBF1DF;
  --c-antiques:#6D48C2;--c-antiques-s:#EFEAFB;
  --c-events:#0E7470;--c-events-s:#DEF2F0;
  --ok:#2E7D4F;--ok-s:#E4F3EA;
  --sea:#DCE9F2;--land:#F1F0EA;--coast:#B9CCDA;
  --r:12px;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111214;--surface:#1A1B1E;--ink:#EDEDEA;--muted:#A0A3A8;--faint:#6E7176;--line:#2A2C30;
    --accent:#F0795D;--accent-soft:#3A2019;--on-accent:#111214;
    --c-covered:#7FB1EA;--c-covered-s:#17263A;
    --c-street:#F59E6B;--c-street-s:#3A2213;
    --c-flea:#E7B25E;--c-flea-s:#33270F;
    --c-antiques:#B79CF5;--c-antiques-s:#291F42;
    --c-events:#62CFC7;--c-events-s:#10302E;
    --ok:#79CF9C;--ok-s:#15301F;
    --sea:#14212C;--land:#1C1D20;--coast:#2C4254;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111214;--surface:#1A1B1E;--ink:#EDEDEA;--muted:#A0A3A8;--faint:#6E7176;--line:#2A2C30;
  --accent:#F0795D;--accent-soft:#3A2019;--on-accent:#111214;
  --c-covered:#7FB1EA;--c-covered-s:#17263A;
  --c-street:#F59E6B;--c-street-s:#3A2213;
  --c-flea:#E7B25E;--c-flea-s:#33270F;
  --c-antiques:#B79CF5;--c-antiques-s:#291F42;
  --c-events:#62CFC7;--c-events-s:#10302E;
  --ok:#79CF9C;--ok-s:#15301F;
  --sea:#14212C;--land:#1C1D20;--coast:#2C4254;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font-family:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header.top{display:flex;align-items:center;gap:14px}
.mark{width:44px;height:44px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"Instrument Serif",Georgia,serif;font-size:21px;line-height:1;flex:none;position:relative}
.mark::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.brand{display:flex;flex-direction:column;gap:2px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,38px);line-height:1.05;margin:0}
.sub{color:var(--muted);margin:0;font-size:13px}

.tabs{display:flex;gap:4px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs > button{flex:none;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs > button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{margin-left:auto;display:inline-flex;gap:2px;flex:none}
.seg button{font-size:12px;font-weight:600;letter-spacing:.04em;border:0;background:transparent;color:var(--faint);padding:6px 8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

h2.title{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:4px 0 0;max-width:62ch}
.section-h{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px;margin:0}

/* Home */
.hero-today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.hero-today .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-today .hd b{font-weight:600}
.mini{display:flex;flex-direction:column}
.mini button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.mini button:first-child{border-top:0}
.mini button:focus-visible{outline:2px solid var(--accent)}
.mini .dot{width:10px;height:10px;border-radius:50%}
.mini .nm{font-weight:500}
.mini .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.mini .st{font-size:12px;font-weight:600;white-space:nowrap}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.tiles{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;font-weight:500}
.tile:first-child{border-top:0}
.tile:hover{background:var(--bg)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tile[aria-disabled="true"]{cursor:default;color:var(--faint);font-weight:400}
.tile[aria-disabled="true"]:hover{background:transparent}
.tile .meta{font-size:12px;font-weight:500;color:var(--faint)}
.tile .go{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* Controls */
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pills{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.pills button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{color:var(--faint)}
.chip[aria-pressed="false"] i{opacity:.35}
.chip.plain{padding-left:12px}
.chip.plain[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sortnote{font-size:13px;color:var(--muted)}

.daybar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.dchip{flex:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 14px;cursor:pointer;display:flex;flex-direction:column;gap:0;font-size:14px;font-weight:500;min-width:64px}
.dchip small{font-size:12px;color:var(--faint);font-weight:500}
.dchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dchip.today small{color:var(--accent)}

/* Cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.card .where{font-size:13px;color:var(--muted)}
.km{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);line-height:1.3}
.km b{display:block;font-size:20px;color:var(--ink);font-weight:600}
.type{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cs);color:var(--cc)}
.when{font-size:14px;display:flex;flex-direction:column;gap:1px}
.when .t{font-variant-numeric:tabular-nums;color:var(--muted)}
.size{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.card .reg{font-size:12px;color:var(--faint)}
.status{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;align-self:flex-start}
.status.open{background:var(--ok-s);color:var(--ok)}
.status.later{background:var(--c-covered-s);color:var(--c-covered)}
.status.done{background:var(--line);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.note{font-size:14px;color:var(--ink);line-height:1.45}
.flag{font-size:12px;color:var(--c-street);font-weight:500}
.actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:14px;height:14px}
.empty{color:var(--muted);padding:12px 0}
.foot{font-size:13px;color:var(--muted);margin:0}

/* Map */
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(68vh,620px);touch-action:none;user-select:none;-webkit-user-select:none}
#msvg{width:100%;height:100%;display:block;cursor:grab}
#msvg.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-weight:500;cursor:pointer;display:grid;place-items:center}
.mapctl button svg{width:18px;height:18px}
.locbtn{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center}
.locmsg{position:absolute;left:10px;right:58px;bottom:10px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.locmsg[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet h3{margin:0;font-size:17px;font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){
  h2.title{font-size:30px}
  .list{grid-template-columns:1fr}
}
</style>
</head>

</div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const dayName=(d,w)=>{const base=new Date(2026,0,4+d);return new Intl.DateTimeFormat(loc(),{weekday:w||"long"}).format(base)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const min=h=>{const [a,b]=h.split(":").map(Number);return a*60+b};
const fmtT=h=>h.replace(/^0/,"");

function runsOn(m,dt){return m.s.filter(x=>x.d.includes(dt.getDay())&&(!x.nth||weekOfMonth(dt)===x.nth))}
function nextDate(m,x){const d=new Date();d.setHours(0,0,0,0);for(let i=0;i<70;i++){if(x.d.includes(d.getDay())&&(!x.nth||weekOfMonth(d)===x.nth))return new Date(d);d.setDate(d.getDate()+1)}return null}
function status(m,dt){const now=dt||new Date();const sl=runsOn(m,now);if(!sl.length)return null;const n=now.getHours()*60+now.getMinutes();
  if(sl.some(x=>n>=min(x.o)&&n<min(x.c)))return"open";if(sl.some(x=>n<min(x.o)))return"later";return"done"}
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const kmMe=m=>st.me?Math.max(1,Math.round(hav(st.me.lat,st.me.lng,m.lat,m.lng)*1.3)):null;

function hoursText(m){
  if(!m.s.length)return tx(m.when);

    let days;

    else{const ord=[1,2,3,4,5,6,0];const ds=ord.filter(d=>x.d.includes(d));
      const run=ds.length>=3&&ds.every((d,i)=>i===0||ord.indexOf(d)===ord.indexOf(ds[i-1])+1);

function zoom(f,cx,cy){const v=st.vb;const nw=Math.min(MW*1.2,Math.max(90,v.w*f));const k=nw/v.w;

function locate(then){

  navigator.geolocation.getCurrentPosition(p=>{
    st.me={lat:p.coords.latitude,lng:p.coords.longitude};
    const inside=st.me.lat<B.latMax&&st.me.lat>B.latMin&&st.me.lng>B.lngMin&&st.me.lng<B.lngMax;
    st.locState=inside?"":t("outside");

// pan + pinch + wheel
let ptrs=new Map(),dragMoved=false,startVB=null,startPts=null;
function toUser(svg,cx,cy){const r=svg.getBoundingClientRect();const v=st.vb;
  const sc=Math.max(v.w/r.width,v.h/r.height);const ox=(r.width*sc-v.w)/2,oy=(r.height*sc-v.h)/2;
  return [v.x-ox+(cx-r.left)*sc,v.y-oy+(cy-r.top)*sc,sc]}
document.addEventListener("pointerdown",e=>{const svg=e.target.closest&&e.target.closest("#msvg");if(!svg)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragMoved=false;startVB=Object.assign({},st.vb);startPts=new Map(ptrs);svg.classList.add("drag")});
document.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const svg=document.getElementById("msvg");if(!svg)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect();const sc=Math.max(startVB.w/r.width,startVB.h/r.height);
  if(ptrs.size===1){const s0=startPts.get(e.pointerId);if(!s0)return;const dx=e.clientX-s0.x,dy=e.clientY-s0.y;
    if(Math.abs(dx)+Math.abs(dy)>4)dragMoved=true;
    st.vb={x:startVB.x-dx*sc,y:startVB.y-dy*sc,w:startVB.w,h:startVB.h};svg.setAttribute("viewBox",`${st.vb.x} ${st.vb.y} ${st.vb.w} ${st.vb.h}`)}
  else if(ptrs.size===2){dragMoved=true;const a=[...ptrs.values()],b0=[...startPts.values()];if(b0.length<2)return;
    const d1=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),d0=Math.hypot(b0[0].x-b0[1].x,b0[0].y-b0[1].y);if(!d0)return;
    const k=Math.min(MW*1.2/startVB.w,Math.max(90/startVB.w,d0/d1));
    const mx=(b0[0].x+b0[1].x)/2,my=(b0[0].y+b0[1].y)/2;const ux=startVB.x+(mx-r.left)*sc,uy=startVB.y+(my-r.top)*sc;
    st.vb={x:ux-(ux-startVB.x)*k,y:uy-(uy-startVB.y)*k,w:startVB.w*k,h:startVB.h*k};svg.setAttribute("viewBox",`${st.vb.x} ${st.vb.y} ${st.vb.w} ${st.vb.h}`)}
});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!ptrs.size){const svg=document.getElementById("msvg");if(svg)svg.classList.remove("drag");if(dragMoved)drawMap()}else{startVB=Object.assign({},st.vb);startPts=new Map(ptrs)}}
document.addEventListener("pointerup",endPtr);document.addEventListener("pointercancel",endPtr);
document.addEventListener("wheel",e=>{const svg=e.target.closest&&e.target.closest("#msvg");if(!svg)return;e.preventDefault();const [ux,uy]=toUser(svg,e.clientX,e.clientY);zoom(e.deltaY>0?1.15:1/1.15,ux,uy)},{passive:false});
window.addEventListener("resize",()=>{if(st.view==="map")drawMap()});

render();
setInterval(()=>{if(st.view!=="map")render()},60000);
})();
</script>
</body>
</html>
